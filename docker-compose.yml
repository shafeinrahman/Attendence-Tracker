services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance_tracker
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: attendance-tracker-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://attendance:attendance@db:5432/attendance_tracker?schema=public
      API_TOKEN: ${API_TOKEN:-attendance-secret-token-12345}
    ports:
      - "3000:3000"

  purge-worker:
    image: attendance-tracker-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://attendance:attendance@db:5432/attendance_tracker?schema=public
    command: ["node", "scripts/purge-cron.js"]

volumes:
  db-data:
